<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <span class="brand-logo"><i class="ri-sparkling-2-fill"></i></span>
      <span class="brand-name">ChatBot</span>
    </div>
    <button class="icon-btn" type="button" title="Close sidebar" (click)="closeSidebar.emit()">
      <i class="ri-layout-left-line"></i>
    </button>
  </div>

  <button class="new-chat-btn" type="button" (click)="startNewChat()">
    <i class="ri-add-line"></i>
    New chat
  </button>

  <nav class="conversation-list">
    @for (group of conversationGroups(); track group.label) {
      <p class="group-label">{{ group.label }}</p>
      @for (conversation of group.conversations; track conversation.id) {
        <div
          class="conversation-item"
          role="button"
          tabindex="0"
          [class.active]="conversation.id === activeConversationId()"
          (click)="selectConversation(conversation.id)"
          (keydown.enter)="selectConversation(conversation.id)">
          <i class="ri-chat-3-line"></i>
          <span class="conversation-title">{{ conversation.title }}</span>
          <button
            class="delete-btn"
            type="button"
            title="Delete chat"
            (click)="deleteConversation($event, conversation.id)">
            <i class="ri-delete-bin-line"></i>
          </button>
        </div>
      }
    } @empty {
      <div class="empty-state">
        <i class="ri-chat-smile-2-line"></i>
        <p>Your chats will show up here</p>
      </div>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <span class="avatar"><i class="ri-user-3-line"></i></span>
      <span class="user-name">Guest</span>
    </div>
    <button
      class="icon-btn"
      type="button"
      [title]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="toggleTheme()">
      <i [class]="isDarkTheme() ? 'ri-sun-line' : 'ri-moon-line'"></i>
    </button>
  </div>
</aside>
