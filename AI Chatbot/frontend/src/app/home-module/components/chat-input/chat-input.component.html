<div class="chat-input-wrapper">
  <div class="input-box">
    <textarea
      #textarea
      rows="1"
      placeholder="Message ChatBot..."
      aria-label="Message"
      [value]="message()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)">
    </textarea>

    @if (isResponding()) {
      <button class="send-btn stop" type="button" title="Stop responding" (click)="stop.emit()">
        <i class="ri-stop-fill"></i>
      </button>
    } @else {
      <button class="send-btn" type="button" title="Send message" [disabled]="!canSend()" (click)="submit()">
        <i class="ri-arrow-up-line"></i>
      </button>
    }
  </div>

  <p class="input-hint">ChatBot can make mistakes. Press Enter to send, Shift + Enter for a new line.</p>
</div>
